name: test
on:
  pull_request:
  push:
    branches:
      - feature/broken-roles-admin-control
jobs:
  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node --check server.js
      - run: node --check shared/rules.js
      - run: node --check shared/bots.js
      - run: node --check public/app.js
      - run: node --check public/admin.js
      - run: npm test
