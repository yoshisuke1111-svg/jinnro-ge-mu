name: verify-talk-once
on:
  push:
    paths:
      - .github/workflows/verify-talk-once.yml
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Verify production conversation lab
        run: |
          set -e
          echo "HEALTH"
          curl -fsS --retry 3 --retry-delay 2 https://jinro-game-pa6t.onrender.com/health/talk
          echo
          START=$(curl -fsS -X POST https://jinro-game-pa6t.onrender.com/talk/api -H 'content-type: application/json' --data '{"action":"start","name":"SYSTEM_TEST"}')
          echo "START=$START"
          SID=$(node -e "const j=JSON.parse(process.argv[1]);process.stdout.write(j.sessionId)" "$START")
          SEND=$(curl -fsS -X POST https://jinro-game-pa6t.onrender.com/talk/api -H 'content-type: application/json' --data "$(node -e "process.stdout.write(JSON.stringify({action:'send',sessionId:process.argv[1],text:'誰が怪しい？'}))" "$SID")")
          echo "SEND=$SEND"
