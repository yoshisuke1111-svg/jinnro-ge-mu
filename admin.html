<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>人狼ゲーム 管理者</title><link rel="stylesheet" href="/admin.css">
</head>
<body>
<header><div><strong>人狼ゲーム</strong><span>管理者ダッシュボード · v0.6.2</span></div><button id="logout" hidden>ログアウト</button></header>
<main>
<section id="login" class="login-card">
  <h1>管理者ログイン</h1><p>サーバー起動時にPowerShellへ表示された管理者パスワードを入力してください。</p>
  <form id="loginForm"><input id="password" type="password" autocomplete="current-password" placeholder="管理者パスワード" required><button>ログイン</button></form>
  <p id="loginError" class="error" aria-live="polite"></p>
</section>
<section id="dashboard" hidden>
  <div class="summary"><div><b id="roomCount">0</b><span>部屋</span></div><div><b id="playerCount">0</b><span>参加者</span></div><div><b id="activeCount">0</b><span>対戦中</span></div><div><b id="streamCount">0</b><span>接続</span></div><div><b id="alertCount">0</b><span>要確認</span></div></div>
  <section class="server-panel">
    <div class="section-title"><div><h2>サーバー状態</h2><span id="serverStatus">ONLINE</span></div><span id="serverUpdated"></span></div>
    <div id="serverMetrics" class="server-metrics"></div>
    <details class="server-errors"><summary>最近のサーバー / APIエラー <span id="errorCount">0</span></summary><div id="serverErrors"></div></details>
  </section>
  <section class="cpu-lab">
    <div><h2>CPU観戦ラボ</h2><p>人間なしでCPUだけの試合を作ります。管理者画面から役職・会話・進行を見ながら早送りできます。</p></div>
    <form id="cpuWatchForm"><label>CPU人数 <input id="cpuWatchCount" type="number" min="4" max="30" value="8"></label><label>部屋コード（任意） <input id="cpuWatchCode" maxlength="16" placeholder="CPU-TEST"></label><button type="submit">CPUだけの試合を作る</button></form>
    <p id="adminNotice" class="admin-notice" aria-live="polite"></p>
  </section>
  <div class="layout">
    <aside><div class="section-title"><h2>部屋一覧</h2><span id="updated"></span></div><div id="rooms" class="rooms"></div></aside>
    <section id="detail" class="detail"><p class="empty">部屋を選ぶと詳細を表示します。</p></section>
  </div>
</section>
</main>
<script src="/admin.js"></script>
</body></html>
