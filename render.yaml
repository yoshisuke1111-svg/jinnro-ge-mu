services:
  - type: web
    name: jinro-game
    runtime: docker
    region: singapore
    plan: free
    numInstances: 1
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: ADMIN_PASSWORD
        sync: false
      - key: AI_CPU_ENABLED
        value: "0"
      - key: AI_PROVIDER
        value: disabled
      - key: AI_CPU_COUNT
        value: "3"
